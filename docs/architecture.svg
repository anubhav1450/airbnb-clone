<text x="1450.0" y="174" text-anchor="middle" font-size="18" font-weight="700" fill="#222222" >Image optimization</text>
<text x="1450.0" y="198" text-anchor="middle" font-size="14" font-weight="400" fill="#484848" >smaller resized / WebP images</text>
<text x="1450.0" y="218" text-anchor="middle" font-size="14" font-weight="400" fill="#484848" >less bandwidth, faster pages</text>
