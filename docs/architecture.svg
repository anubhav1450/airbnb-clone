<polyline points="770,145 770,124 1450,124 1450,145" fill="none" stroke="#e0284f" stroke-width="2.4" stroke-dasharray="7 5" stroke-linejoin="round"/>
<polygon points="1450,145 1445.5,135.0 1454.5,135.0" fill="#e0284f"/>
