<text x="1352" y="71" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff" >1</text>
<text x="1372" y="71" text-anchor="start" font-size="13" font-weight="400" fill="#6a6a6a" >numbers follow one request</text>
