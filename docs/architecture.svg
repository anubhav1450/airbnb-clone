<text x="1100.0" y="413" text-anchor="middle" font-size="14" font-weight="400" fill="#484848" >auth (JWT) · rate limits</text>
<text x="1100.0" y="433" text-anchor="middle" font-size="14" font-weight="400" fill="#484848" >routing</text>
