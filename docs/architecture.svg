<text x="560.0" y="788" text-anchor="middle" font-size="14" font-weight="400" fill="#484848" >frequently used data, sessions</text>
<text x="560.0" y="808" text-anchor="middle" font-size="14" font-weight="400" fill="#484848" >sits in front of the database</text>
<rect x="740" y="735" width="500" height="92" rx="10" fill="#ffffff" stroke="#2e8b57" stroke-width="2"/>
<text x="990.0" y="764" text-anchor="middle" font-size="18" font-weight="700" fill="#222222" >Object storage</text>
<text x="990.0" y="788" text-anchor="middle" font-size="14" font-weight="400" fill="#484848" >listing images (originals)</text>
<text x="990.0" y="808" text-anchor="middle" font-size="14" font-weight="400" fill="#484848" >served through the CDN</text>
<text x="60" y="878" text-anchor="start" font-size="15" font-weight="700" fill="#222222" >Scaling: move reads to replicas and Redis; consider partitioning only if that is not enough.</text>
<rect x="1290" y="690" width="480" height="215" rx="14" fill="#f0fafb" stroke="#127a8a" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="1308" y="717" text-anchor="start" font-size="15" font-weight="700" fill="#127a8a" letter-spacing="1">4 · SEARCH</text>
<rect x="1315" y="735" width="430" height="92" rx="10" fill="#ffffff" stroke="#127a8a" stroke-width="2"/>
<text x="1530.0" y="764" text-anchor="middle" font-size="18" font-weight="700" fill="#222222" >Search index</text>
<text x="1530.0" y="788" text-anchor="middle" font-size="14" font-weight="400" fill="#484848" >listing search + filters</text>
<text x="1530.0" y="808" text-anchor="middle" font-size="14" font-weight="400" fill="#484848" >add replicas or shards as it grows</text>
<text x="1315" y="878" text-anchor="start" font-size="15" font-weight="700" fill="#222222" >Scaling: keeps search load off the database.</text>
