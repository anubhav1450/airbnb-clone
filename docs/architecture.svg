<text x="1580.0" y="1025" text-anchor="middle" font-size="14" font-weight="400" fill="#484848" >logs · metrics · basic tracing</text>
<text x="1580.0" y="1045" text-anchor="middle" font-size="14" font-weight="400" fill="#484848" >alerts on errors / latency</text>
