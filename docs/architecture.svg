<polyline points="970,403 920,403" fill="none" stroke="#333333" stroke-width="2.4" stroke-linejoin="round"/>
<polygon points="920,403 930.0,398.5 930.0,407.5" fill="#333333"/>
<circle cx="945" cy="387" r="13" fill="#222222"/>
<text x="945" y="392" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff" >5</text>
<text x="1300" y="378" text-anchor="start" font-size="15" font-weight="700" fill="#222222" >Scaling: services are stateless,</text>
<text x="1300" y="398" text-anchor="start" font-size="15" font-weight="700" fill="#222222" >so scale by adding more identical</text>
<text x="1300" y="418" text-anchor="start" font-size="15" font-weight="700" fill="#222222" >instances behind a load balancer.</text>
<text x="230" y="342" text-anchor="start" font-size="13" font-weight="400" fill="#3a6ecc" font-style="italic">stateless services, run in containers</text>
