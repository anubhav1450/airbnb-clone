<text x="1120.0" y="596" text-anchor="middle" font-size="14" font-weight="400" fill="#484848" >event stream / async event backbone</text>
<text x="1120.0" y="616" text-anchor="middle" font-size="14" font-weight="400" fill="#484848" >booking · listing · image events</text>
<rect x="1300" y="543" width="440" height="82" rx="10" fill="#ffffff" stroke="#7b4bb7" stroke-width="2"/>
<text x="1520.0" y="572" text-anchor="middle" font-size="18" font-weight="700" fill="#222222" >Consumers / workers</text>
<text x="1520.0" y="596" text-anchor="middle" font-size="14" font-weight="400" fill="#484848" >notifications · search-index updates</text>
<text x="1520.0" y="616" text-anchor="middle" font-size="14" font-weight="400" fill="#484848" >media processing · analytics</text>
<polyline points="1265,584 1300,584" fill="none" stroke="#7b4bb7" stroke-width="2.4" stroke-dasharray="7 5" stroke-linejoin="round"/>
<polygon points="1300,584 1290.0,588.5 1290.0,579.5" fill="#7b4bb7"/>
