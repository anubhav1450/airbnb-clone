<text x="770.0" y="391" text-anchor="middle" font-size="18" font-weight="700" fill="#222222" >Users / Auth</text>
<text x="770.0" y="415" text-anchor="middle" font-size="14" font-weight="400" fill="#484848" >accounts, roles</text>
<polyline points="1100,231 1100,360" fill="none" stroke="#333333" stroke-width="2.4" stroke-linejoin="round"/>
