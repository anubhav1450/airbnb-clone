<polygon points="975,584 965.0,588.5 965.0,579.5" fill="#7b4bb7"/>
<text x="904" y="606" text-anchor="start" font-size="13" font-weight="400" fill="#7b4bb7" font-style="italic">events</text>
<text x="975" y="647" text-anchor="start" font-size="14" font-weight="700" fill="#222222" >Decouples services from background work.</text>
<text x="1335" y="647" text-anchor="start" font-size="14" font-weight="700" fill="#222222" >Consumers scale independently as events grow.</text>
<rect x="30" y="690" width="1240" height="215" rx="14" fill="#f3fbf4" stroke="#2e8b57" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="48" y="717" text-anchor="start" font-size="15" font-weight="700" fill="#2e8b57" letter-spacing="1">3 · STORAGE</text>
<rect x="60" y="735" width="320" height="92" rx="10" fill="#ffffff" stroke="#2e8b57" stroke-width="2"/>
<text x="220.0" y="764" text-anchor="middle" font-size="18" font-weight="700" fill="#222222" >PostgreSQL</text>
<text x="220.0" y="788" text-anchor="middle" font-size="14" font-weight="400" fill="#484848" >primary + read replicas</text>
<text x="220.0" y="808" text-anchor="middle" font-size="14" font-weight="400" fill="#484848" >users, listings, bookings</text>
