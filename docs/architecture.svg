<text x="48" y="957" text-anchor="start" font-size="15" font-weight="700" fill="#c07a10" letter-spacing="1">5 · DEPLOYMENT</text>
<rect x="60" y="972" width="400" height="84" rx="10" fill="#ffffff" stroke="#c07a10" stroke-width="2"/>
<text x="260.0" y="1001" text-anchor="middle" font-size="18" font-weight="700" fill="#222222" >CI/CD</text>
<text x="260.0" y="1025" text-anchor="middle" font-size="14" font-weight="400" fill="#484848" >test → build container image</text>
<text x="260.0" y="1045" text-anchor="middle" font-size="14" font-weight="400" fill="#484848" >preview per pull request</text>
