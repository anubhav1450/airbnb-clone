<rect x="60" y="145" width="200" height="86" rx="10" fill="#ffffff" stroke="#e0284f" stroke-width="2"/>
<text x="160.0" y="174" text-anchor="middle" font-size="18" font-weight="700" fill="#222222" >Client</text>
<text x="160.0" y="198" text-anchor="middle" font-size="14" font-weight="400" fill="#484848" >browser (desktop web)</text>
<rect x="330" y="145" width="240" height="86" rx="10" fill="#ffffff" stroke="#e0284f" stroke-width="2"/>
<text x="450.0" y="174" text-anchor="middle" font-size="18" font-weight="700" fill="#222222" >DNS + WAF</text>
<text x="450.0" y="198" text-anchor="middle" font-size="14" font-weight="400" fill="#484848" >routing · basic protection</text>
<rect x="640" y="145" width="260" height="86" rx="10" fill="#ffffff" stroke="#e0284f" stroke-width="2"/>
<text x="770.0" y="174" text-anchor="middle" font-size="18" font-weight="700" fill="#222222" >CDN / edge cache</text>
<text x="770.0" y="198" text-anchor="middle" font-size="14" font-weight="400" fill="#484848" >static assets + images</text>
<text x="770.0" y="218" text-anchor="middle" font-size="14" font-weight="400" fill="#484848" >served close to users</text>
<rect x="970" y="145" width="260" height="86" rx="10" fill="#ffffff" stroke="#e0284f" stroke-width="2"/>
<text x="1100.0" y="174" text-anchor="middle" font-size="18" font-weight="700" fill="#222222" >React web app</text>
<text x="1100.0" y="198" text-anchor="middle" font-size="14" font-weight="400" fill="#484848" >static build, cached</text>
<text x="1100.0" y="218" text-anchor="middle" font-size="14" font-weight="400" fill="#484848" >on the CDN</text>
