<text x="303.5" y="415" text-anchor="middle" font-size="14" font-weight="400" fill="#484848" >queries</text>
<rect x="383.0" y="362" width="152" height="82" rx="10" fill="#ffffff" stroke="#3a6ecc" stroke-width="2"/>
<text x="459.0" y="391" text-anchor="middle" font-size="18" font-weight="700" fill="#222222" >Availability</text>
<text x="459.0" y="415" text-anchor="middle" font-size="14" font-weight="400" fill="#484848" >calendar</text>
