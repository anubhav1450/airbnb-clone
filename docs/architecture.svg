<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1150" viewBox="0 0 1800 1150" font-family="Helvetica, Arial, sans-serif">
<rect width="1800" height="1150" fill="#ffffff"/>
<text x="40" y="46" text-anchor="start" font-size="28" font-weight="700" fill="#222222" >Vacation-rental marketplace — production architecture</text>
<text x="40" y="74" text-anchor="start" font-size="15" font-weight="400" fill="#6a6a6a" >The submitted clone is only the front-end slice (static React app, no backend). This diagram represents the production-scale marketplace it would sit in.</text>
<rect x="1330" y="26" width="440" height="52" rx="8" fill="#ffffff" stroke="#cccccc"/>
